[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-liberated"
dynamic = ["version"]
description = 'A local-only MCP server that converts documents to Markdown (the "liberated", cloud-free fork of Microsoft MarkItDown).'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Adam Fourney", email = "adamfo@microsoft.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "mcp~=1.8.0",
  "markitdown-liberated-core[all]>=0.1.1,<0.2.0",
]

# Use the local, cloud-stripped core engine source instead of any published
# PyPI package, so the MCP server runs fully offline (no Azure / LLM / cloud).
[tool.uv.sources]
markitdown-liberated-core = { path = "../markitdown-liberated-core", editable = true }

[project.urls]
Source = "https://github.com/microsoft/markitdown"

[tool.hatch.version]
path = "src/markitdown_liberated_mcp/__about__.py"

[project.scripts]
markitdown-liberated = "markitdown_liberated_mcp.__main__:main"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/markitdown_liberated_mcp tests}"

[tool.coverage.run]
source_pkgs = ["markitdown_liberated_mcp", "tests"]
branch = true
parallel = true
omit = [
  "src/markitdown_liberated_mcp/__about__.py",
]

[tool.coverage.paths]
markitdown_liberated_mcp = ["src/markitdown_liberated_mcp", "*/markitdown-liberated/src/markitdown_liberated_mcp"]
tests = ["tests", "*/markitdown-liberated/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/markitdown_liberated_mcp"]

[tool.hatch.build.targets.wheel]
packages = ["src/markitdown_liberated_mcp"]
